name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: docker.io
  IMAGE: wellsaar/wellsaar-gpu-burn

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cuda: [ "13.5.0", "13.4.3" ]

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags + labels)
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
        tags: |
          type=raw,value=local,enable=${{ github.event_name == 'pull_request' }}
          type=raw,value=cuda-${{ matrix.cuda }}-ubuntu24.04,enable=${{ github.event_name != 'pull_request' }}
          type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && matrix.cuda == '13.5.0' }}
        labels: |
          org.opencontainers.image.title=gpu-burn
          org.opencontainers.image.description=Multi-GPU CUDA stress test
          org.opencontainers.image.source=https://github.com/wellsaar/gpu-burn

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        build-args: |
          CUDA_VERSION=${{ matrix.cuda }}
          IMAGE_DISTRO=ubuntu24.04
        push: ${{ github.event_name == 'push' }}
        load: ${{ github.event_name != 'push' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=cuda-${{ matrix.cuda }}
        cache-to: type=gha,mode=max,scope=cuda-${{ matrix.cuda }}

    - name: Smoke test binary
      if: github.event_name != 'push'
      run: |
        docker run --rm --entrypoint "" ${{ env.IMAGE }}:local ls /app
        docker run --rm --entrypoint "" ${{ env.IMAGE }}:local /app/gpu_burn -h

  remove-stale-tags:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Remove stale Docker Hub tags
      env:
        DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        # One-time cleanup of tags published by older workflow versions.
        # Idempotent: 404 means the tag is already gone. Safe to remove
        # this job once all listed tags have been deleted.
        image="${{ env.IMAGE }}"
        for tag in sha-29955c8 cuda-13.5-ubuntu24.04; do
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -u "${DH_USER}:${DH_TOKEN}" \
            -X DELETE "https://hub.docker.com/v2/repositories/${image}/tags/${tag}")
          if [ "$code" = "204" ]; then
            echo "deleted stale tag: ${tag}"
          elif [ "$code" = "404" ]; then
            echo "stale tag already gone: ${tag}"
          else
            echo "::error::failed to delete stale tag ${tag} (HTTP ${code})"
            exit 1
          fi
        done
